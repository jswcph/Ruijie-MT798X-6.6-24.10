      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Cache DL
      uses: actions/cache@v5
      with:
        path: dl
        key: mt798x-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Feeds
      uses: actions/cache@v5
      with:
        path: feeds
        key: mt798x-feeds-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Toolchain
      uses: RuijieNetworksCommunity/cache-wrt-toolchain@main
      with:
        mixkey: ${{ hashFiles('.github/workflows/cache-control') }}

    - name: Add iStore Feed
      id: add-istore-feed
      run: |
        set -e
        if ! grep -qE '^[[:space:]]*src-git[[:space:]]+istore[[:space:]]' feeds.conf.default; then
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
        fi

    - name: Update Feeds
      id: update-feeds
      run: ./scripts/feeds update -a

    - name: Install Feeds
      id: install-feeds
      run: ./scripts/feeds install -a

    - name: Install iStore Package
      id: install-istore
      run: |
        set -e
        ./scripts/feeds install -d y -p istore luci-app-store
        test -f package/feeds/istore/luci-app-store/Makefile || test -f feeds/istore/luci-app-store/Makefile

    - name: Load Configuration
      id: load-config
      run: |
        [ -e defconfig/mt7981-ruijie-max.config ] && cp defconfig/mt7981-ruijie-max.config .config

    - name: Make Compile Configuration
      id: make-compile-config
      run: |
        make defconfig

    - name: Enable iStore
      id: enable-istore
      run: |
        set -e
        grep -q '^CONFIG_PACKAGE_luci-app-store=' .config && sed -i '/^CONFIG_PACKAGE_luci-app-store=/d' .config || true
        printf '%s\n' 'CONFIG_PACKAGE_luci-app-store=y' >> .config
        make defconfig
        grep -q '^CONFIG_PACKAGE_luci-app-store=y' .config



    - name: 精简状态概览内存显示
      run: |
        set -e

        FILE="feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/20_memory.js"

        if [ ! -f "$FILE" ]; then
          echo "ERROR: 找不到文件 $FILE"
          find feeds package -path '*/view/status/include/20_memory.js' -print
          exit 1
        fi

        python3 - "$FILE" <<'PY'
        import re
        import sys
        from pathlib import Path

        path = Path(sys.argv[1])
        text = path.read_text()

        # 兼容空格、换行等源码格式差异
        pattern = re.compile(
            r'var\s+fields\s*=\s*\[.*?\]\s*;.*?(?=var\s+table\s*=)',
            re.S
        )

        replacement = (
            "var fields=[_('Total Available'),"
            "(mem.available)?mem.available:"
            "(mem.total&&mem.free&&mem.buffered)?"
            "mem.free+mem.buffered:null,"
            "mem.total];"
            "if(mem.cached)"
            "fields.push(_('Cached'),mem.cached,mem.total);"
        )

        new_text, count = pattern.subn(replacement, text, count=1)

        if count != 1:
            print("ERROR: 未匹配到内存字段区域")
            print("===== 文件内容前 3000 字符 =====")
            print(text[:3000])
            raise SystemExit(1)

        path.write_text(new_text)

        print("OK: 内存字段已修改")
        print("===== 修改后相关代码 =====")

        updated = path.read_text()
        pos = updated.find("var fields")

        print(updated[pos:pos + 700])

        if "Total Available" not in updated or "Cached" not in updated:
            raise SystemExit("ERROR: 保留字段检查失败")

        if "Swap free" in updated or "Buffered" in updated:
            raise SystemExit("ERROR: 仍存在隐藏字段")

        print("OK: 修改核验通过")
        PY
    - name: Download Package
      id: download-package
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(($(nproc) * 3 / 2)) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check Disk Space
      if: (!cancelled())
      run: df -hT

    - name: Upload Artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: mt7981-max-bin
        path: bin

  mt7986-max:
    name: MT7986 Max Build
    runs-on: ubuntu-22.04
    needs: [cache-toolchain]
    steps:
    - name: Initialization Environment
      id: env
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
          libncursesw5-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
          lld lldb llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
          python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

        sudo apt-get clean
        sudo timedatectl set-timezone "$TZ"

    - name: Optimize Disk
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with: 
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout Repository
      id: checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Cache DL
      uses: actions/cache@v5
      with:
        path: dl
        key: mt798x-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Feeds
      uses: actions/cache@v5
      with:
        path: feeds
        key: mt798x-feeds-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Toolchain
      uses: RuijieNetworksCommunity/cache-wrt-toolchain@main
      with:
        mixkey: ${{ hashFiles('.github/workflows/cache-control') }}

    - name: Add iStore Feed
      id: add-istore-feed
      run: |
        set -e
        if ! grep -qE '^[[:space:]]*src-git[[:space:]]+istore[[:space:]]' feeds.conf.default; then
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
        fi

    - name: Update Feeds
      id: update-feeds
      run: ./scripts/feeds update -a

    - name: Install Feeds
      id: install-feeds
      run: ./scripts/feeds install -a

    - name: Install iStore Package
      id: install-istore
      run: |
        set -e
        ./scripts/feeds install -d y -p istore luci-app-store
        test -f package/feeds/istore/luci-app-store/Makefile || test -f feeds/istore/luci-app-store/Makefile

    - name: Load Configuration
      id: load-config
      run: |
        [ -e defconfig/mt7986-ruijie-max.config ] && cp defconfig/mt7986-ruijie-max.config .config

    - name: Make Compile Configuration
      id: make-compile-config
      run: |
        make defconfig

    - name: Enable iStore
      id: enable-istore
      run: |
        set -e
        grep -q '^CONFIG_PACKAGE_luci-app-store=' .config && sed -i '/^CONFIG_PACKAGE_luci-app-store=/d' .config || true
        printf '%s\n' 'CONFIG_PACKAGE_luci-app-store=y' >> .config
        make defconfig
        grep -q '^CONFIG_PACKAGE_luci-app-store=y' .config

    - name: Download Package
      id: download-package
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(($(nproc) * 3 / 2)) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check Disk Space
      if: (!cancelled())
      run: df -hT

    - name: Upload Artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: mt7986-max-bin
        path: bin

  max-release:
    name: Publish Max Release
    runs-on: ubuntu-22.04
    needs: [mt7981-max, mt7986-max]
    steps:
    - name: Checkout Repository
      id: checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 2

    - name: Download MT7981 Max Artifacts
      id: download-mt7981
      if: (!cancelled())
      uses: actions/download-artifact@main
      with:
        name: mt7981-max-bin
        path: artifacts/mt7981

    - name: Download MT7986 Max Artifacts
      id: download-mt7986
      if: (!cancelled())
      uses: actions/download-artifact@main
      with:
        name: mt7986-max-bin
        path: artifacts/mt7986

    - name: Organize Files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        mkdir -p release

        rm -rf artifacts/mt7981/packages
        rm -rf artifacts/mt7986/packages

        find artifacts/mt7981/targets/mediatek/filogic/ -type f ! -name "*.bin" -delete
        find artifacts/mt7981/targets/mediatek/filogic/ -type f -name "*-bl2.bin" -delete
        find artifacts/mt7981/targets/mediatek/filogic/ -mindepth 1 -type d -exec rm -rf {} +
        find artifacts/mt7986/targets/mediatek/filogic/ -type f ! -name "*.bin" -delete
        find artifacts/mt7986/targets/mediatek/filogic/ -type f -name "*-bl2.bin" -delete
        find artifacts/mt7986/targets/mediatek/filogic/ -mindepth 1 -type d -exec rm -rf {} +

        cp -r artifacts/mt7981/targets/mediatek/filogic/*.bin release/
        cp -r artifacts/mt7986/targets/mediatek/filogic/*.bin release/

        cd release

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate Release TAG
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD | tr '/' '-')
        echo "release_tag=R$(date +"%y.%-m.%-d.%H%M")-$SHORT_HASH-$BRANCH_NAME-max" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Changes:"
          echo ""
          git log -1 --pretty=format:"- %s (%h) by %an"
          echo ""
          echo "### Diff:"
          git diff --name-only HEAD^ HEAD | sed 's/^/- /'
        } > release.txt

        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        prerelease: false
