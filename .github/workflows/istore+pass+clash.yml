name: Build Ruijieistore
on:
  workflow_dispatch:
  
permissions:
  contents: write
  
env:
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  postmsg:
    name: Post Group Messages
    if: false
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Get Commit Info
      id: get_commit
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | xargs)
        COMMIT_AUTHOR=$(git log -1 --pretty=%an)
        echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_OUTPUT
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT

    - name: Send Messages
      id: request
      uses: tyrrrz/action-http-request@prime
      with:
        url: https://api.1tip.cc:8000/qqbot/send_group_msg
        method: POST
        headers: |
          Content-Type: application/json
          Authorization: ${{ secrets.ORG_QQ_BOOT_SECRET }}
        body: |
          {
              "group_id": "860015881",
              "message": [
                  {
                      "type": "text",
                      "data": {
                          "text": "【更新提示】\n检测到新的Github Action开发版构建实例，仓库名【${{ github.repository }}】，提交人【${{ steps.get_commit.outputs.COMMIT_AUTHOR }}】，更改内容【${{ steps.get_commit.outputs.COMMIT_MSG }}】，系统已开始构建，请耐心等待，构建完成后可于仓库的Release处下载。（如果长时间未生成Release，请召唤管理）\n"
                      }
                  }
              ]
          }
        retry-count: 3
        retry-delay: 500

    - name: Send Messages to Private Group
      id: request-private
      uses: tyrrrz/action-http-request@prime
      with:
        url: https://api.1tip.cc:8000/qqbot/send_group_msg
        method: POST
        headers: |
          Content-Type: application/json
          Authorization: ${{ secrets.ORG_QQ_BOOT_SECRET }}
        body: |
          {
              "group_id": ${{ secrets.ORG_QQ_PRVI_GROUP_NUM }},
              "message": [
                  {
                      "type": "text",
                      "data": {
                          "text": "【${{ github.repository }}】有新的Commit，提交人【${{ steps.get_commit.outputs.COMMIT_AUTHOR }}】，更改内容【${{ steps.get_commit.outputs.COMMIT_MSG }}】\n"
                      }
                  }
              ]
          }
        retry-count: 3
        retry-delay: 500

  cache-toolchain:
    name: Compile & Cache Toolchain
    runs-on: ubuntu-22.04
    steps:
    - name: Initialization Environment
      id: env
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
          libncursesw5-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
          lld lldb llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
          python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo apt-get clean
        sudo timedatectl set-timezone "$TZ"

    - name: Optimize Disk
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with: 
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout Repository
      id: checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Cache DL
      uses: actions/cache@v5
      with:
        path: dl
        key: mt798x-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Feeds
      uses: actions/cache@v5
      with:
        path: feeds
        key: mt798x-feeds-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Toolchain
      uses: RuijieNetworksCommunity/cache-wrt-toolchain@main
      with:
        mixkey: ${{ hashFiles('.github/workflows/cache-control') }}

    - name: Update Feeds
      id: update-feeds
      run: ./scripts/feeds update -a

    - name: Install Feeds
      id: install-feeds
      run: ./scripts/feeds install -a

    - name: Load Configuration
      id: load-config
      run: |
        [ -e defconfig/mt7986.config ] && cp defconfig/mt7986.config .config

    - name: Make Compile Configuration
      id: make-compile-config
      run: |
        make defconfig

    - name: Download Package
      id: download-package
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

          
    - name: Compile Toolchain
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(($(nproc) * 3 / 2)) toolchain/install || make -j1 toolchain/install || make -j1 V=s toolchain/install
        echo "status=success" >> $GITHUB_OUTPUT

